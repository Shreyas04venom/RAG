<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="hhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#hhBg)" stroke="url(#hhGrad)" stroke-width="3"/>

  <!-- Glowing Accent Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#hhGrad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- HH Monogram Geometry -->
  <g filter="url(#glow)">
    <!-- First 'H' Left Pillar -->
    <rect x="28" y="34" width="10" height="60" rx="5" fill="url(#hhGrad)"/>
    <!-- First 'H' Right Pillar -->
    <rect x="46" y="34" width="10" height="60" rx="5" fill="url(#hhGrad)"/>
    <!-- First 'H' Bridge -->
    <rect x="28" y="58" width="28" height="10" rx="5" fill="url(#hhGrad)"/>

    <!-- Second 'H' Left Pillar -->
    <rect x="72" y="34" width="10" height="60" rx="5" fill="url(#hhGrad)"/>
    <!-- Second 'H' Right Pillar -->
    <rect x="90" y="34" width="10" height="60" rx="5" fill="url(#hhGrad)"/>
    <!-- Second 'H' Bridge -->
    <rect x="72" y="58" width="28" height="10" rx="5" fill="url(#hhGrad)"/>
  </g>

  <!-- Goa Accent Node / Pulse Indicator -->
  <circle cx="64" cy="63" r="4" fill="#38BDF8" filter="url(#glow)"/>
  <path d="M 44 100 Q 64 108 84 100" fill="none" stroke="url(#goldGlow)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
